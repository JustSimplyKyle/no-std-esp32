[package]
edition      = "2021"
name         = "no-std-esp32"
rust-version = "1.86"
version      = "0.1.0"

[[bin]]
name = "no-std-esp32"
path = "./src/bin/main.rs"

[dependencies]
defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32"] }
esp-hal                = { version = "=1.0.0-rc.0", features = ["defmt", "esp32", "unstable", "rt"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.17.0", features = [
  "defmt",
  "esp32",
  "exception-handler",
  "panic-handler",
] }

edge-dhcp           = { version = "0.5.0" }
edge-nal            = { version = "0.5.0" }
edge-nal-embassy    = { version = "0.5.0" }

embassy-net = { version = "0.6.0", features = [ "tcp", "udp", "dhcpv4", "medium-ethernet",  "defmt"] }
embedded-io         = { version = "0.6.1", default-features = false }
embedded-io-async   = "0.6.1"
esp-println = { version = "0.15.0", features = ["defmt-espflash", "esp32"] }
embedded-graphics = { version = "0.8.1", features = ["defmt"] }
epd-waveshare = { version = "0.6.0", path = "../epd-waveshare" }
embedded-hal-bus = "0.3.0"
xtensa-lx-rt = { version = "0.19.0", features = ["esp32"] }
esp-wifi = { version = "0.15.0", features = ["esp32", "defmt", "wifi", "esp-now"] }
esp-alloc        = "0.8.0"
# embassy-executor = "0.9.1"
esp-hal-embassy = { version = "0.8.1", features = ["esp32"] }
embassy-executor ={ version = "0.7.0", features = ["defmt", "nightly"] }
picoserve = { version = "0.17.1", features = ["embassy"] }
static_cell = { version = "2.1.1" }
embassy-time = "0.4.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }# esp-idf-hal = "0.45.2"
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embedded-hal = "1.0.0"
fugit = "0.3.9"
# embedded-svc = { version = "0.28.1", features = ["defmt"] }

[profile.dev.package.esp-wifi]
opt-level = 3


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = 3

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
